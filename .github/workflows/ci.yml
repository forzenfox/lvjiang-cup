name: CI

on:
  push:
    branches: [main, master, develop, 'feature/**', 'bugfix/**']
  pull_request:
    branches: [main, master, develop]

jobs:
  # 检测文件变更
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  # 前端静态检查、测试与构建
  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (静态检查)
        run: npm run lint

      - name: Check Prettier format (格式检查)
        run: npm run format:check

      - name: Run TypeScript check (类型检查)
        run: npm run check

      - name: Build frontend (构建)
        run: npm run build

  # 后端静态检查、测试与构建
  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (静态检查)
        run: npm run lint
        env:
          # 忽略换行符差异，避免 Windows CRLF 导致检查失败
          ESLINT_NO_DEV_ERRORS: true

      - name: Check Prettier format (格式检查)
        run: npm run format:check

      - name: Build backend (构建)
        run: npm run build

  # 汇总状态
  ci-summary:
    runs-on: ubuntu-latest
    needs: [changes, frontend, backend]
    if: always()

    steps:
      - name: CI Summary
        run: |
          echo "========================================"
          echo "           CI 流水线执行结果"
          echo "========================================"

          FRONTEND_TRIGGERED="${{ needs.changes.outputs.frontend == 'true' }}"
          BACKEND_TRIGGERED="${{ needs.changes.outputs.backend == 'true' }}"
          FRONTEND_RESULT="${{ needs.frontend.result }}"
          BACKEND_RESULT="${{ needs.backend.result }}"

          if [ "$FRONTEND_TRIGGERED" = "true" ]; then
            if [ "$FRONTEND_RESULT" = "success" ]; then
              echo "前端: ✅ 通过"
            else
              echo "前端: ❌ 失败"
            fi
          else
            echo "前端: ⏭️ 跳过（无文件变更）"
          fi

          if [ "$BACKEND_TRIGGERED" = "true" ]; then
            if [ "$BACKEND_RESULT" = "success" ]; then
              echo "后端: ✅ 通过"
            else
              echo "后端: ❌ 失败"
            fi
          else
            echo "后端: ⏭️ 跳过（无文件变更）"
          fi

          echo "========================================"

          # 检查是否有任务失败
          if [ "$FRONTEND_TRIGGERED" = "true" ] && [ "$FRONTEND_RESULT" != "success" ]; then
            echo "❌ CI 流水线执行失败"
            exit 1
          fi

          if [ "$BACKEND_TRIGGERED" = "true" ] && [ "$BACKEND_RESULT" != "success" ]; then
            echo "❌ CI 流水线执行失败"
            exit 1
          fi

          echo "✅ CI 流水线全部通过"
